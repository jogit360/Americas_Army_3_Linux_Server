# AA3 Linux Server Configuration
# ====================================

# Server Identity
ServerName = "AA3 Server"
MapName = "Bridge_night_clear"
GameDescription = "America's Army 3"

# Network Configuration
Port = 8777
QueryPort = 27015
MaxPlayers = 32

# Steam Configuration
# AA3 SteamCMD AppID = 13180
SteamAppID = 13180
SteamGameServerPort = 8777
SteamQueryPort = 27015

# Server mode
# 0 = Steam-authenticated (default; requires Steam SDK + steamclient)
# 1 = Standalone (no Steam, no master server listing, direct-IP only)
# CLI override: --standalone / --no-steam / --steam
Standalone = 0

# Steam GameServer properties
Version = "1.0.0.0"
SecureMode = 0
PasswordProtected = 0
BotCount = 0
GameTags = ""
Product = "AA3"
ModDir = "AA3"

# Server Behavior
MaxRoundTime = 600
MinPlayers = 2
TeamSize = 8
RespawnTime = 10
FriendlyFire = 0

# Logging
LogLevel = INFO
LogFile = "./aa3_server.log"

# Gameplay Parameters
GravityScale = 1.0
WalkSpeed = 300.0
SprintSpeed = 500.0
JumpZVelocity = 500.0
MaxHealth = 100
